<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle - AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="main-layout">
        <!-- Left side: Chat -->
        <div class="chat-section">
          <div class="chatbot-header">
            <h1>Pickle AI</h1>
            <p>Your friendly AI assistant</p>
          </div>

          <div class="chat-box" id="chatBox">
            <div class="message bot-message">
              <span class="bot-label">Pickle:</span>
              <p>
                Hello! I'm Pickle, your AI assistant. How can I help you today?
              </p>
            </div>
          </div>

          <div class="input-container">
            <input
              type="text"
              id="userInput"
              class="message-input"
              placeholder="Type your message..."
              autocomplete="off"
            />
            <button id="sendBtn" class="send-button">Send</button>
          </div>
        </div>

        <!-- Right side: Controls -->
        <div class="controls-section">
          <div class="controls-panel">
            <h3>Options</h3>

            <div class="control-group">
              <label>Model</label>
              <button
                id="changeModelBtn"
                class="model-button"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <span id="currentModel">Dill</span> ▾
              </button>
              <div
                id="modelDropdown"
                class="model-dropdown hidden"
                role="menu"
                aria-label="Model selector"
              >
                <div
                  class="model-item"
                  role="menuitem"
                  data-value="Dill"
                  tabindex="0"
                >
                  <div class="model-item-title">Dill</div>
                  <div class="model-item-desc">Conversational</div>
                </div>
                <div
                  class="model-item"
                  role="menuitem"
                  data-value="Cucumber"
                  tabindex="0"
                >
                  <div class="model-item-title">Cucumber</div>
                  <div class="model-item-desc">Math-focused</div>
                </div>
                <div
                  class="model-item"
                  role="menuitem"
                  data-value="Gourmet"
                  tabindex="0"
                >
                  <div class="model-item-title">Gourmet</div>
                  <div class="model-item-desc">Premium</div>
                </div>
              </div>
            </div>

            <div class="control-group">
              <label>Scrollbar</label>
              <button
                id="changeScrollbarBtn"
                class="scrollbar-button"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <span id="currentScrollbar">Auto</span> ▾
              </button>
              <div
                id="scrollbarDropdown"
                class="scrollbar-dropdown hidden"
                role="menu"
                aria-label="Scrollbar selector"
              >
                <div
                  class="scrollbar-item"
                  role="menuitem"
                  data-value="auto"
                  tabindex="0"
                >
                  <div class="scrollbar-item-title">Auto</div>
                  <div class="scrollbar-item-desc">Show on hover</div>
                </div>
                <div
                  class="scrollbar-item"
                  role="menuitem"
                  data-value="always"
                  tabindex="0"
                >
                  <div class="scrollbar-item-title">Always</div>
                  <div class="scrollbar-item-desc">Always visible</div>
                </div>
                <div
                  class="scrollbar-item"
                  role="menuitem"
                  data-value="thin"
                  tabindex="0"
                >
                  <div class="scrollbar-item-title">Thin</div>
                  <div class="scrollbar-item-desc">Compact</div>
                </div>
              </div>
            </div>

            <div class="control-group">
              <label>Theme</label>
              <button
                id="changeThemeBtn"
                class="theme-button"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <span id="currentTheme">Light</span> ▾
              </button>
              <div
                id="themeDropdown"
                class="theme-dropdown hidden"
                role="menu"
                aria-label="Theme selector"
              >
                <div
                  class="theme-item"
                  role="menuitem"
                  data-value="light"
                  tabindex="0"
                >
                  <div class="theme-item-title">Light</div>
                  <div class="theme-item-desc">Default</div>
                </div>
                <div
                  class="theme-item"
                  role="menuitem"
                  data-value="dark"
                  tabindex="0"
                >
                  <div class="theme-item-title">Dark</div>
                  <div class="theme-item-desc">Easy on eyes</div>
                </div>
              </div>
            </div>

            <div class="control-group">
              <label>Chat Info</label>
              <div class="chat-info">
                <div class="info-item">
                  <span class="info-label">Messages:</span>
                  <span id="messageCount" class="info-value">1</span>
                </div>
              </div>
            </div>

            <div class="footer-info">
              <small>Powered by AI</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- overlay scrollbar appended to body so it isn't clipped by container -->
    <div id="overlayScrollbar" class="overlay-scrollbar" aria-hidden="true">
      <div
        id="overlayThumb"
        class="overlay-thumb"
        role="scrollbar"
        aria-controls="chatBox"
        aria-orientation="vertical"
      ></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
